# Render Blueprint: one web service that builds the client and runs the game
# server (HTTP + WebSockets on the same port). Accounts and items are stored in
# a Neon Postgres database, so the service needs no disk and can use the free plan.
services:
  - type: web
    name: vantage
    runtime: node
    plan: free               # free instances sleep after 15 min idle; use starter to keep it awake
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # Render asks for this when you apply the Blueprint: paste Neon's connection string
